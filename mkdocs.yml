site_name: KubeMapReduce Docs
site_description: Distributed MapReduce platform — INF-419, Technical University of Crete
site_author: KubeMapReduce Team

theme:
  name: material
  palette:
    scheme: slate
    primary: deep purple
    accent: cyan
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - toc.integrate

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - API Reference:
      - REST API: api/rest.md
      - gRPC API: api/grpc.md
  - Services:
      - CLI Service: cli-service/cli/README.md
      - Manager — API: manager-service/api/README.md
      - Manager — Scheduler: manager-service/manager/README.md
      - Manager — Models: manager-service/models/README.md
      - Auth Service: auth-service/auth/README.md

syntax = "proto3";

package mapreduce;

option go_package = "kubemapreduce/proto";

// WorkerService is the gRPC API used by worker pods to communicate with the Manager.
// Authentication: all RPCs must include the worker token in gRPC metadata:
//   "x-worker-token": <value of MANAGER_WORKER_RPC_TOKEN secret>
// The Manager enforces this via a server-side unary/stream interceptor.
// Omitting the token results in codes.Unauthenticated.
service WorkerService {
  rpc Register (RegisterRequest) returns (TaskAssignment);
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatResponse);
  rpc TaskComplete (TaskCompleteRequest) returns (Ack);
  rpc TaskFailed (TaskFailedRequest) returns (Ack);
  rpc TaskStream (stream StreamRequest) returns (stream StreamResponse);
}

// ShuffleService handles intermediate MapReduce shuffle data exchange between workers.
// Authentication: same "x-worker-token" metadata requirement as WorkerService.
service ShuffleService {
  rpc PushShuffleData (stream ShuffleDataChunk) returns (Ack);
  rpc GetShuffleData (ShuffleDataRequest) returns (stream ShuffleDataChunk);
}

message ShuffleDataChunk {
  string job_id = 1;
  int32 partition_id = 2;
  bytes data = 3;
}

message ShuffleDataRequest {
  string job_id = 1;
  int32 partition_id = 2;
}

message StreamRequest {
  string worker_id = 1;
  oneof payload {
    ReadyForTaskRequest ready = 2;
    HeartbeatRequest heartbeat = 3;
    TaskCompleteRequest complete = 4;
    TaskFailedRequest failed = 5;
  }
}

message StreamResponse {
  oneof payload {
    TaskAssignment assignment = 1;
    HeartbeatResponse heartbeat_ack = 2;
    Ack ack = 3;
  }
}

message ReadyForTaskRequest {
  string job_id = 1;
}

enum TaskType {
  MAP = 0;
  REDUCE = 1;
}

message RegisterRequest {
  string task_id = 1;
  string attempt_id = 2; 
}

message TaskAssignment { 
  string task_id = 1;
  string attempt_id = 2; 
  string job_id = 3;
  TaskType type = 4;
  string code_location = 5;
  string combiner_location = 6; 
  string runtime_env = 7;      
  repeated string data_locations = 8; 
  int64 byte_start = 9;        
  int64 byte_end = 10;         
  int32 partition_id = 11;     
  bool is_manifest = 12; 
  int32 total_reducers = 13;
  string split_checksum = 14;
  string lease_id = 15;
  repeated InputSplit input_splits = 16;
}

message InputSplit {
  string input_uri = 1;
  int64 byte_start = 2;
  int64 byte_end = 3;
  string split_checksum = 4;
}

message HeartbeatRequest {
  string task_id = 1;
  string attempt_id = 2;
  string lease_id = 3;
}

message HeartbeatResponse { 
  enum Action {
    CONTINUE = 0;
    TERMINATE = 1; 
  }
  Action action = 1;
}

message TaskCompleteRequest { 
  string task_id = 1; 
  string attempt_id = 2;
  string lease_id = 3;
  repeated string output_locations = 4;
  repeated string output_checksums = 5;
}

message TaskFailedRequest {
  string task_id = 1;
  string attempt_id = 2;
  string lease_id = 3;      // Fencing: Manager rejects stale failures
  string error_message = 4;
}

message Ack {
  bool success = 1;
}

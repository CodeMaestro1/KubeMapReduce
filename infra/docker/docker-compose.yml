services:
  keycloak:
    image: quay.io/keycloak/keycloak:23.0.6
    container_name: mapreduce-keycloak
    env_file:
      - .env
    ports:
      - "8080:8080"
    command: start-dev
    volumes:
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c ':> /dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  auth-setup:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.auth-setup
    container_name: mapreduce-auth-setup
    env_file:
      - .env
    environment:
      - KEYCLOAK_BASE_URL=http://keycloak:8080
    depends_on:
      keycloak:
        condition: service_healthy
    restart: on-failure

  postgres:
    image: postgres:17
    container_name: mapreduce-postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: mapreduce-minio
    command: server /data --console-address ":9001"
    env_file:
      - .env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "timeout 20 bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 30s

  minio-init:
    image: minio/mc
    container_name: mapreduce-minio-init
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/mapreduce-inputs &&
      mc mb --ignore-existing local/mapreduce-staging &&
      mc mb --ignore-existing local/mapreduce-outputs"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    container_name: mapreduce-api
    env_file:
      - .env
    ports:
      - "8081:8081"
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      auth-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c ':> /dev/tcp/127.0.0.1/8081' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  manager:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.manager
    container_name: mapreduce-manager
    env_file:
      - .env
    ports:
      - "50051:50051"
    depends_on:
      api:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    container_name: mapreduce-worker
    env_file:
      - .env
    ports:
      - "50052:50052"
    depends_on:
      manager:
        condition: service_started

volumes:
  postgres-data:
  minio-data:
  keycloak-data:

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KubeMapReduce Auth UI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #334155;
      --text: #f1f5f9;
      --text-secondary: #94a3b8;
      --muted: #64748b;
      --border: #334155;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-glow: rgba(59, 130, 246, 0.25);
      --secondary: #8b5cf6;
      --secondary-hover: #7c3aed;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #10b981;
      --code-bg: #0f172a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(59, 130, 246, 0.15), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(139, 92, 246, 0.1), transparent);
      pointer-events: none;
      z-index: -1;
    }

    .container {
      max-width: 520px;
      width: 100%;
      margin: 24px auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 
        0 0 0 1px rgba(255, 255, 255, 0.05),
        0 20px 50px -12px rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px var(--primary-glow);
    }

    .logo svg {
      width: 28px;
      height: 28px;
      fill: white;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.025em;
      background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1.6;
    }

    p {
      margin-top: 10px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 16px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary);
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 999px;
      padding: 6px 12px;
    }

    .badge::before {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--primary);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin: 24px 0;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 12px;
      display: block;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    .actions-secondary {
      display: flex;
      gap: 10px;
    }

    button {
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 12px;
      padding: 12px 16px;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:hover {
      background: var(--surface-hover);
      border-color: var(--muted);
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    .primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 4px 14px var(--primary-glow);
    }

    .primary:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
      box-shadow: 0 6px 20px var(--primary-glow);
    }

    .secondary {
      background: transparent;
      border-color: var(--secondary);
      color: var(--secondary);
    }

    .secondary:hover {
      background: rgba(139, 92, 246, 0.1);
      border-color: var(--secondary-hover);
    }

    .danger {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--danger);
    }

    .danger:hover {
      background: rgba(239, 68, 68, 0.1);
      border-color: var(--danger);
    }

    .actions-secondary button {
      flex: 1;
      font-size: 13px;
      padding: 10px 12px;
    }

    .panel {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-top: 12px;
      overflow: hidden;
    }

    .panel-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .panel-icon {
      width: 18px;
      height: 18px;
      fill: var(--muted);
    }

    .panel-title {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    pre {
      white-space: pre-wrap;
      word-wrap: break-word;
      margin: 0;
      font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
      font-size: 12px;
      line-height: 1.7;
      color: var(--text);
      max-height: 200px;
      overflow-y: auto;
    }

    pre::-webkit-scrollbar {
      width: 6px;
    }

    pre::-webkit-scrollbar-track {
      background: transparent;
    }

    pre::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
      margin: 0;
    }

    .status-panel {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.05) 0%, rgba(139, 92, 246, 0.05) 100%);
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }

    .footer a {
      color: var(--primary);
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 640px) {
      body {
        padding: 16px;
      }

      .container {
        margin: 8px auto;
        padding: 24px;
        border-radius: 16px;
      }

      .actions {
        grid-template-columns: 1fr;
      }

      .actions-secondary {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <span class="badge">Authentication Console</span>
      <h1>KubeMapReduce</h1>
      <p class="subtitle">Sign in with Keycloak to access the MapReduce API and manage your jobs.</p>
    </div>

    <div class="divider"></div>

    <span class="section-label">Account</span>
    <div class="actions">
      <button class="primary" id="signin">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <polyline points="10 17 15 12 10 7"/>
          <line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
        Sign in
      </button>
      <button class="secondary" id="signup">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="8.5" cy="7" r="4"/>
          <line x1="20" y1="8" x2="20" y2="14"/>
          <line x1="23" y1="11" x2="17" y2="11"/>
        </svg>
        Create account
      </button>
    </div>

    <div class="actions-secondary">
      <button class="danger" id="logout">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Logout
      </button>
      <button id="health">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
        </svg>
        Health check
      </button>
      <button id="whoami">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        Token info
      </button>
    </div>

    <div class="divider"></div>

    <div class="panel status-panel">
      <div class="panel-header">
        <svg class="panel-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="16" x2="12" y2="12"/>
          <line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
        <strong class="panel-title">Status</strong>
      </div>
      <p class="muted" id="status">Loading auth config...</p>
    </div>

    <div class="panel">
      <div class="panel-header">
        <svg class="panel-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 17 10 11 4 5"/>
          <line x1="12" y1="19" x2="20" y2="19"/>
        </svg>
        <strong class="panel-title">Output</strong>
      </div>
      <pre id="output">No output yet.</pre>
    </div>

    <div class="footer">
      Powered by <a href="https://www.keycloak.org" target="_blank" rel="noopener">Keycloak</a>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const outputEl = document.getElementById('output');

    const setStatus = (msg) => { statusEl.textContent = msg; };
    const setOutput = (obj) => {
      if (typeof obj === 'string') {
        outputEl.textContent = obj;
        return;
      }
      outputEl.textContent = JSON.stringify(obj, null, 2);
    };

    const parseJwt = (token) => {
      const parts = token.split('.');
      if (parts.length < 2) return null;
      try {
        const json = atob(parts[1].replace(/-/g, '+').replace(/_/g, '/'));
        return JSON.parse(json);
      } catch {
        return null;
      }
    };

    const loadKeycloakScript = (baseUrl) => new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = `${baseUrl}/js/keycloak.js`;
      script.onload = resolve;
      script.onerror = () => reject(new Error('Failed to load keycloak.js'));
      document.head.appendChild(script);
    });

    (async () => {
      try {
        const cfgResp = await fetch('/ui/config');
        if (!cfgResp.ok) throw new Error(`Failed config request: ${cfgResp.status}`);
        const cfg = await cfgResp.json();

        await loadKeycloakScript(cfg.keycloakBaseUrl);

        const keycloak = new window.Keycloak({
          url: cfg.keycloakBaseUrl,
          realm: cfg.realm,
          clientId: cfg.clientId,
        });

        const authenticated = await keycloak.init({
          onLoad: 'check-sso',
          checkLoginIframe: false,
          pkceMethod: 'S256'
        });

        if (authenticated) {
          setStatus(`Signed in as ${keycloak.tokenParsed?.preferred_username || 'unknown user'}`);
        } else {
          setStatus('Not signed in');
        }

        document.getElementById('signin').onclick = () => keycloak.login({
          redirectUri: window.location.origin + '/'
        });

        document.getElementById('signup').onclick = () => keycloak.register({
          redirectUri: window.location.origin + '/'
        });

        document.getElementById('logout').onclick = () => keycloak.logout({
          redirectUri: window.location.origin + '/'
        });

        document.getElementById('health').onclick = async () => {
          const resp = await fetch('/health');
          const body = await resp.json();
          setOutput({ statusCode: resp.status, body });
        };

        document.getElementById('whoami').onclick = () => {
          if (!keycloak.token) {
            setOutput('No token. Please sign in first.');
            return;
          }

          const claims = parseJwt(keycloak.token) || keycloak.tokenParsed;
          setOutput({
            accessTokenPreview: keycloak.token.substring(0, 40) + '...',
            claims,
            roles: claims?.realm_access?.roles || []
          });
        };
      } catch (error) {
        setStatus('Failed to initialize auth UI');
        setOutput(error.message || String(error));
      }
    })();
  </script>
</body>
</html>

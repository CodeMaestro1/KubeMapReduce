<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KubeMapReduce Auth UI</title>
  <style>
    :root {
      --bg: #eef2ff;
      --surface: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --secondary: #111827;
      --secondary-hover: #030712;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(circle at top right, #e0e7ff 0, transparent 40%),
        radial-gradient(circle at bottom left, #dbeafe 0, transparent 45%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 760px;
      margin: 24px auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 26px;
      box-shadow: 0 14px 34px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -0.02em;
    }

    p {
      margin-top: 10px;
      color: #374151;
      line-height: 1.5;
    }

    .badge {
      display: inline-block;
      margin-bottom: 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--primary);
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 999px;
      padding: 4px 10px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
      margin-bottom: 14px;
    }

    button {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      background: #f9fafb;
    }

    button:active {
      transform: translateY(0);
    }

    .primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .primary:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    .secondary {
      background: var(--secondary);
      border-color: var(--secondary);
      color: #fff;
    }

    .secondary:hover {
      background: var(--secondary-hover);
      border-color: var(--secondary-hover);
    }

    .danger {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }

    .danger:hover {
      background: var(--danger-hover);
      border-color: var(--danger-hover);
    }

    .panel {
      background: #f9fafb;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
    }

    .panel-title {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      letter-spacing: 0.01em;
    }

    pre {
      white-space: pre-wrap;
      word-wrap: break-word;
      margin: 0;
      font-size: 12px;
      line-height: 1.5;
      color: #0f172a;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
      margin: 0;
    }

    @media (max-width: 640px) {
      body {
        padding: 14px;
      }

      .container {
        margin: 8px auto;
        padding: 18px;
      }

      button {
        flex: 1 1 calc(50% - 10px);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="badge">Authentication Console</span>
    <h1>MapReduce Authentication</h1>
    <p>Use Keycloak to sign in or create an account, then test your API token on this page.</p>

    <div class="actions">
      <button class="primary" id="signin">Sign in</button>
      <button class="secondary" id="signup">Create account</button>
      <button class="danger" id="logout">Logout</button>
      <button id="health">Call /health</button>
      <button id="whoami">Show token info</button>
    </div>

    <div class="panel">
      <strong class="panel-title">Status</strong>
      <p class="muted" id="status">Loading auth config...</p>
    </div>

    <div class="panel">
      <strong class="panel-title">Output</strong>
      <pre id="output">No output yet.</pre>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const outputEl = document.getElementById('output');

    const setStatus = (msg) => { statusEl.textContent = msg; };
    const setOutput = (obj) => {
      if (typeof obj === 'string') {
        outputEl.textContent = obj;
        return;
      }
      outputEl.textContent = JSON.stringify(obj, null, 2);
    };

    const parseJwt = (token) => {
      const parts = token.split('.');
      if (parts.length < 2) return null;
      try {
        const json = atob(parts[1].replace(/-/g, '+').replace(/_/g, '/'));
        return JSON.parse(json);
      } catch {
        return null;
      }
    };

    const loadKeycloakScript = (baseUrl) => new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = `${baseUrl}/js/keycloak.js`;
      script.onload = resolve;
      script.onerror = () => reject(new Error('Failed to load keycloak.js'));
      document.head.appendChild(script);
    });

    (async () => {
      try {
        const cfgResp = await fetch('/ui/config');
        if (!cfgResp.ok) throw new Error(`Failed config request: ${cfgResp.status}`);
        const cfg = await cfgResp.json();

        await loadKeycloakScript(cfg.keycloakBaseUrl);

        const keycloak = new window.Keycloak({
          url: cfg.keycloakBaseUrl,
          realm: cfg.realm,
          clientId: cfg.clientId,
        });

        const authenticated = await keycloak.init({
          onLoad: 'check-sso',
          checkLoginIframe: false,
          pkceMethod: 'S256'
        });

        if (authenticated) {
          setStatus(`Signed in as ${keycloak.tokenParsed?.preferred_username || 'unknown user'}`);
        } else {
          setStatus('Not signed in');
        }

        document.getElementById('signin').onclick = () => keycloak.login({
          redirectUri: window.location.origin + '/'
        });

        document.getElementById('signup').onclick = () => keycloak.register({
          redirectUri: window.location.origin + '/'
        });

        document.getElementById('logout').onclick = () => keycloak.logout({
          redirectUri: window.location.origin + '/'
        });

        document.getElementById('health').onclick = async () => {
          const resp = await fetch('/health');
          const body = await resp.json();
          setOutput({ statusCode: resp.status, body });
        };

        document.getElementById('whoami').onclick = () => {
          if (!keycloak.token) {
            setOutput('No token. Please sign in first.');
            return;
          }

          const claims = parseJwt(keycloak.token) || keycloak.tokenParsed;
          setOutput({
            accessTokenPreview: keycloak.token.substring(0, 40) + '...',
            claims,
            roles: claims?.realm_access?.roles || []
          });
        };
      } catch (error) {
        setStatus('Failed to initialize auth UI');
        setOutput(error.message || String(error));
      }
    })();
  </script>
</body>
</html>

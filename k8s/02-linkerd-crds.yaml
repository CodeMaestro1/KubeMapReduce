# Linkerd Policy API CRDs
#
# These Custom Resource Definitions enable the PolicyAPI for service mesh
# traffic management. PolicyAPI provides a Kubernetes-native way to define
# timeouts, retries, circuit breaking, and other resilience patterns per
# route (HTTP/gRPC path).
#
# Key resources:
# - Policy: Defines retry budgets, timeouts, and circuit breaker thresholds
# - Route: Maps specific paths/methods to policies
# - AuthorizationPolicy: (future) RBAC for service-to-service communication
---
# Policy resource: defines traffic behavior (timeout, retry, circuit-break)
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: policies.policy.linkerd.io
  labels:
    app.kubernetes.io/name: linkerd
spec:
  group: policy.linkerd.io
  scope: Namespaced
  names:
    kind: Policy
    plural: policies
    singular: policy
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                targetRef:
                  type: object
                  properties:
                    group:
                      type: string
                    kind:
                      type: string
                    name:
                      type: string
                http:
                  type: array
                  items:
                    type: object
                    properties:
                      match:
                        type: object
                        properties:
                          method:
                            type: string
                          path:
                            type: string
                      timeouts:
                        type: object
                        properties:
                          request:
                            type: string
                          backendRequest:
                            type: string
                      retries:
                        type: object
                        properties:
                          limit:
                            type: integer
                          backoff:
                            type: string
                      circuitBreaker:
                        type: object
                        properties:
                          maxRequests:
                            type: integer
                          maxPendingRequests:
                            type: integer
                          errorThresholdPercentage:
                            type: integer
                          minRequestVolume:
                            type: integer
---
# AuthorizationPolicy resource: defines which services can call which services
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: authorizationpolicies.policy.linkerd.io
  labels:
    app.kubernetes.io/name: linkerd
spec:
  group: policy.linkerd.io
  scope: Namespaced
  names:
    kind: AuthorizationPolicy
    plural: authorizationpolicies
    singular: authorizationpolicy
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                targetRef:
                  type: object
                  properties:
                    group:
                      type: string
                    kind:
                      type: string
                    name:
                      type: string
                rules:
                  type: array
                  items:
                    type: object
                    properties:
                      from:
                        type: array
                        items:
                          type: object
                          properties:
                            principalSet:
                              type: array
                              items:
                                type: string
                      to:
                        type: array
                        items:
                          type: object
                          properties:
                            group:
                              type: string
                            kind:
                              type: string
                            name:
                              type: string

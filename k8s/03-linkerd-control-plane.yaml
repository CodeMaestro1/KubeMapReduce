# Linkerd Control Plane Deployment
#
# This manifest deploys the core Linkerd control plane components:
# - destination: Service discovery and policy enforcement
# - proxy-injector: Sidecar injection via mutating webhook
# - identity: Workload certificate issuer (auto-renewal)
#
# The control plane runs in the linkerd namespace and manages all
# injected services across the cluster.
---
# Destination Deployment
# Provides service discovery, endpoint resolution, and policy enforcement
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkerd-destination
  namespace: linkerd
  labels:
    app.kubernetes.io/name: linkerd
    app.kubernetes.io/component: destination
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: linkerd
      app.kubernetes.io/component: destination
  template:
    metadata:
      labels:
        app.kubernetes.io/name: linkerd
        app.kubernetes.io/component: destination
      annotations:
        # Destination pods are never injected (control plane exemption)
        linkerd.io/inject: disabled
    spec:
      serviceAccountName: linkerd-control-plane
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: destination
          image: ghcr.io/linkerd/controller:stable-2.15.0
          args:
            - destination
            - -addr=:8086
            - -metrics-addr=:9993
          ports:
            - name: http
              containerPort: 8086
            - name: metrics
              containerPort: 9993
          env:
            - name: LINKERD_NAMESPACE
              value: linkerd
            - name: LINKERD_IDENTITY_TRUST_DOMAIN
              value: cluster.local
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
# Identity Deployment
# Issues and auto-renews workload identity certificates
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkerd-identity
  namespace: linkerd
  labels:
    app.kubernetes.io/name: linkerd
    app.kubernetes.io/component: identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: linkerd
      app.kubernetes.io/component: identity
  template:
    metadata:
      labels:
        app.kubernetes.io/name: linkerd
        app.kubernetes.io/component: identity
      annotations:
        linkerd.io/inject: disabled
    spec:
      serviceAccountName: linkerd-control-plane
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: identity
          image: ghcr.io/linkerd/controller:stable-2.15.0
          args:
            - identity
            - -addr=:8080
            - -metrics-addr=:9990
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9990
          env:
            - name: LINKERD_NAMESPACE
              value: linkerd
            - name: LINKERD_IDENTITY_TRUST_DOMAIN
              value: cluster.local
            - name: LINKERD_IDENTITY_ISSUANCE_LIFETIME
              value: 24h
            - name: LINKERD_IDENTITY_CLOCK_SKEW_ALLOWANCE
              value: 20s
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
# Proxy Injector Deployment
# Mutating webhook that auto-injects Linkerd sidecar proxies
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkerd-proxy-injector
  namespace: linkerd
  labels:
    app.kubernetes.io/name: linkerd
    app.kubernetes.io/component: proxy-injector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: linkerd
      app.kubernetes.io/component: proxy-injector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: linkerd
        app.kubernetes.io/component: proxy-injector
      annotations:
        linkerd.io/inject: disabled
    spec:
      serviceAccountName: linkerd-control-plane
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: proxy-injector
          image: ghcr.io/linkerd/controller:stable-2.15.0
          args:
            - proxy-injector
            - -addr=:8443
            - -metrics-addr=:9992
          ports:
            - name: webhook
              containerPort: 8443
            - name: metrics
              containerPort: 9992
          env:
            - name: LINKERD_NAMESPACE
              value: linkerd
            - name: LINKERD_IDENTITY_TRUST_DOMAIN
              value: cluster.local
            - name: LINKERD_PROXY_IMAGE
              value: ghcr.io/linkerd/proxy:stable-2.15.0
            - name: LINKERD_PROXY_INIT_IMAGE
              value: ghcr.io/linkerd/proxy-init:v2.3.0
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /live
              port: webhook
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: webhook
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: webhook-certs
              mountPath: /var/run/linkerd/webhook
              readOnly: true
      volumes:
        - name: webhook-certs
          secret:
            secretName: linkerd-webhook-certs
            optional: true
---
# Service for destination
apiVersion: v1
kind: Service
metadata:
  name: linkerd-destination
  namespace: linkerd
  labels:
    app.kubernetes.io/name: linkerd
    app.kubernetes.io/component: destination
spec:
  selector:
    app.kubernetes.io/name: linkerd
    app.kubernetes.io/component: destination
  ports:
    - name: http
      port: 8086
      targetPort: 8086
  clusterIP: None
---
# Service for identity
apiVersion: v1
kind: Service
metadata:
  name: linkerd-identity
  namespace: linkerd
  labels:
    app.kubernetes.io/name: linkerd
    app.kubernetes.io/component: identity
spec:
  selector:
    app.kubernetes.io/name: linkerd
    app.kubernetes.io/component: identity
  ports:
    - name: grpc
      port: 25000
      targetPort: 8080
---
# MutatingWebhookConfiguration for sidecar injection
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: linkerd-proxy-injector-webhook
  labels:
    app.kubernetes.io/name: linkerd
webhooks:
  - name: linkerd.io/inject
    clientConfig:
      service:
        name: linkerd-proxy-injector
        namespace: linkerd
        path: "/"
      caBundle: 
    rules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
    failurePolicy: Fail
    admissionReviewVersions: ["v1", "v1beta1"]
    sideEffects: None
    timeoutSeconds: 30
    namespaceSelector:
      matchLabels:
        linkerd.io/inject: enabled

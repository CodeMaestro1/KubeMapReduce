# MinIO — S3-compatible object storage for inputs, intermediate shuffle data,
# and final outputs.
#
# Deployed as a StatefulSet so the bucket data lives on a stable PVC. The PVC
# is RWX so that, in a multi-node cluster, additional replicas (or migration
# pods) can attach to the same volume. On a single-node test cluster RWX is
# satisfied by the default storage class without additional configuration.
#
# minio-creds is the canonical Secret consumed by every workload that talks to
# object storage (Manager, UI, Worker Jobs). No service may embed S3 keys.
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: mapreduce
  labels:
    app.kubernetes.io/name: minio
spec:
  selector:
    app.kubernetes.io/name: minio
  type: NodePort
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
      nodePort: 30900
    - name: console
      port: 9001
      targetPort: 9001
      nodePort: 30901
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: mapreduce
  labels:
    app.kubernetes.io/name: minio
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2024-10-13T13-34-11Z
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: MINIO_ROOT_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteMany"]
        resources:
          requests:
            storage: 50Gi
---
# minio-setup — one-shot Job that runs after MinIO is ready.
# Configures the 24-hour expiry ILM rule on the mapreduce-inputs bucket
# so that orphaned temp/<userID>/ objects are automatically purged without
# any application-side cleanup. This satisfies the "Orphaned Upload
# Mitigation" requirement: a presigned PUT that is never promoted to
# inputs/<jobID>/ will be reaped by MinIO within 24 hours.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-setup
  namespace: mapreduce
  labels:
    app.kubernetes.io/name: minio-setup
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2024-10-08T09-37-26Z
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -e
              mc alias set myminio \
                http://minio.mapreduce.svc.cluster.local:9000 \
                "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              mc mb --ignore-existing myminio/mapreduce-inputs
              mc ilm add \
                --prefix "temp/" \
                --expiry-days 1 \
                myminio/mapreduce-inputs
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: MINIO_ROOT_PASSWORD
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

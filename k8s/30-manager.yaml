# Manager Service — orchestrates jobs, schedules tasks, and holds the
# fault-tolerance state machine.
#
# Runs as a StatefulSet so each pod has a stable DNS name
# (manager-{0,1,2}.manager-headless.mapreduce.svc.cluster.local), which the
# UI service uses for FNV-1a hash routing of jobs to a specific Manager
# replica.
#
# All sensitive values come from Kubernetes Secrets (postgres-creds,
# minio-creds, manager-secrets). No credentials are inlined.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: manager-config
  namespace: mapreduce
data:
  KEYCLOAK_BASE_URL: "http://keycloak.mapreduce.svc.cluster.local:8080"
  KEYCLOAK_REALM: "mapreduce"
  KEYCLOAK_AUDIENCE: "mapreduce-api"
  # JWKS fetched from internal cluster DNS — fast, no external round-trip.
  KEYCLOAK_JWKS_URL: "http://keycloak.mapreduce.svc.cluster.local:8080/realms/mapreduce/protocol/openid-connect/certs"
  # Issuer must match KC_HOSTNAME_URL in 25-keycloak.yaml and the URL
  # the CLI uses to reach Keycloak. Override this per environment.
  # Production: https://auth.mapreduce.local/realms/mapreduce
  KEYCLOAK_ISSUER: "https://auth.mapreduce.local/realms/mapreduce"
  STATEFULSET_REPLICAS: "3"
  HEARTBEAT_INTERVAL_SEC: "10"
  MAX_MISSED_HEARTBEATS: "3"
  SERVER_ADDR: ":8081"
  GRPC_ADDR: ":50051"
  MINIO_USE_SSL: "false"
---
# Headless Service required by StatefulSet for stable per-pod DNS:
#   manager-0.manager-headless.mapreduce.svc.cluster.local
#   manager-1.manager-headless.mapreduce.svc.cluster.local
#   manager-2.manager-headless.mapreduce.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: manager-headless
  namespace: mapreduce
  labels:
    app.kubernetes.io/name: manager
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: manager
  ports:
    - name: http
      port: 8081
      targetPort: 8081
    - name: grpc
      port: 50051
      targetPort: 50051
---
# Cluster-internal Service for fan-in to any Manager replica (e.g. /readyz
# probes from external load balancers). Worker pods use the headless service
# instead so they reach the specific replica that owns their job.
apiVersion: v1
kind: Service
metadata:
  name: manager
  namespace: mapreduce
  labels:
    app.kubernetes.io/name: manager
spec:
  selector:
    app.kubernetes.io/name: manager
  ports:
    - name: http
      port: 8081
      targetPort: 8081
    - name: grpc
      port: 50051
      targetPort: 50051
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: manager
  namespace: mapreduce
  labels:
    app.kubernetes.io/name: manager
spec:
  serviceName: manager-headless
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: manager
      annotations:
        # Enable Linkerd auto-injection for sidecar proxy
        # This allows the Manager to participate in the service mesh with:
        # - Automatic mTLS to all peers
        # - Per-RPC method timeouts enforced by policies
        # - Distributed tracing and metrics collection
        linkerd.io/inject: enabled
    spec:
      serviceAccountName: manager
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: manager
          image: kubemapreduce/manager:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
            - name: grpc
              containerPort: 50051
          envFrom:
            - configMapRef:
                name: manager-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Each replica advertises its own stable DNS name so the UI
            # service can hash-route directly to it.
            - name: MANAGER_ADDR
              value: "$(POD_NAME).manager-headless.mapreduce.svc.cluster.local:50051"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-creds
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-creds
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-creds
                  key: POSTGRES_DB
            - name: DATABASE_DSN
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres.mapreduce.svc.cluster.local:5432/$(POSTGRES_DB)?sslmode=prefer"
            - name: MINIO_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: S3_ENDPOINT
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: S3_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: S3_SECRET_KEY
            - name: MANAGER_INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: manager-secrets
                  key: MANAGER_INTERNAL_API_KEY
            - name: MANAGER_WORKER_RPC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: manager-secrets
                  key: MANAGER_WORKER_RPC_TOKEN
            - name: GRPC_TLS_CERT_FILE
              value: /tls/tls.crt
            - name: GRPC_TLS_KEY_FILE
              value: /tls/tls.key
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: grpc-tls
              mountPath: /tls
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: grpc-tls
          secret:
            secretName: grpc-tls

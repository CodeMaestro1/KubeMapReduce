# ClusterRole for Manager to list nodes (Data Locality Scheduling).
# Required because nodes are cluster-scoped resources and cannot be accessed
# via a regular Role.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: manager-node-reader-binding
subjects:
  - kind: ServiceAccount
    name: manager
    namespace: mapreduce
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: manager-node-reader

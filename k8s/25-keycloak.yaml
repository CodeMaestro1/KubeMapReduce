# Keycloak — OAuth2/OIDC provider used by the UI service for user JWTs and by
# the CLI for the password grant flow.
#
# Deployed as a single Deployment (stateless from K8s' point of view; realm
# state lives in the Keycloak DB which, in this minimal manifest, is the
# embedded H2 store via `start-dev`). For production, point Keycloak at the
# postgres StatefulSet by adding KC_DB=postgres + KC_DB_URL env vars.
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: mapreduce
  labels:
    app.kubernetes.io/name: keycloak
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: mapreduce
  labels:
    app.kubernetes.io/name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:23.0.6
          imagePullPolicy: IfNotPresent
          args: ["start-dev"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: keycloak-creds
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-creds
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: KC_PROXY
              value: edge
            - name: KC_HOSTNAME_STRICT
              value: "false"
            # Force consistent issuer URL regardless of how Keycloak is accessed.
            # CLI must set KEYCLOAK_BASE_URL to this value (or use port-forward
            # with API_URL pointing here). For production replace with the real
            # external hostname.
            # Set to http://<node-ip>:30080 for minikube/k3s, or the real
            # external hostname for production. Must match KEYCLOAK_ISSUER
            # in manager-config ConfigMap and KEYCLOAK_BASE_URL used by CLI.
            - name: KC_HOSTNAME_URL
              value: "http://localhost:30080"
            - name: KC_HOSTNAME_ADMIN_URL
              value: "http://localhost:30080"
          readinessProbe:
            httpGet:
              path: /realms/master
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /realms/master
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"

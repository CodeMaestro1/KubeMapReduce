# Keycloak — OAuth2/OIDC provider used by the UI service for user JWTs and by
# the CLI for the password grant flow.
#
# Deployed as a single Deployment backed by PostgreSQL for persistent realm
# state. The container runs in production mode (`start`) instead of `start-dev`.
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: mapreduce
  labels:
    app.kubernetes.io/name: keycloak
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: mapreduce
  labels:
    app.kubernetes.io/name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:23.0.6
          imagePullPolicy: IfNotPresent
          args: ["start", "--http-enabled=true"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: keycloak-creds
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-creds
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-creds
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-creds
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-creds
                  key: POSTGRES_DB
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: "jdbc:postgresql://postgres.mapreduce.svc.cluster.local:5432/$(POSTGRES_DB)?sslmode=require"
            - name: KC_DB_USERNAME
              value: "$(POSTGRES_USER)"
            - name: KC_DB_PASSWORD
              value: "$(POSTGRES_PASSWORD)"
            - name: KC_PROXY
              value: edge
            - name: KC_HOSTNAME_STRICT
              value: "false"
            # Force consistent issuer URL regardless of how Keycloak is accessed.
            # CLI must set KEYCLOAK_BASE_URL to this value (or use port-forward
            # with API_URL pointing here). For production replace with the real
            # external hostname.
            # Must match KEYCLOAK_ISSUER in manager-config ConfigMap.
            - name: KC_HOSTNAME_URL
              value: "https://auth.mapreduce.local"
            - name: KC_HOSTNAME_ADMIN_URL
              value: "https://auth.mapreduce.local"
          readinessProbe:
            httpGet:
              path: /realms/master
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /realms/master
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
